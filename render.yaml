services:
  - type: web
    name: bdp-cloud-mvp
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_ENCRYPTION_KEY
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
